[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sifu"
version = "0.1.0"
description = "Local action logger that turns workflow into SOPs, tutorials, and automation"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# python-multipart is not optional: sifu_ui.app imports `Form` from fastapi for
# the /workflow/{id}/edit route, and FastAPI raises at import time without it.
# Leaving it out made `sifu ui` fail on a clean install even with this extra.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "watchdog>=4.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
sifu = "sifu.cli:main"
sifubar = "sifu.bar.app:main"

[tool.setuptools.packages.find]
where = ["src"]
