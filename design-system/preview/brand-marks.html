<!doctype html><meta charset="utf-8">
<title>Brand · Seal & Stamp</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; display: flex; gap: 24px; align-items: center; justify-content: space-around; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .seal { width: 84px; height: 84px; border: 1.6px solid #2D4A87; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .seal::before { content: ''; position: absolute; inset: 4px; border: 0.8px solid #2D4A87; border-radius: 50%; }
  .seal span { font-family: 'IBM Plex Sans', 'Hiragino Sans', sans-serif; font-size: 40px; color: #2D4A87; font-weight: 500; }
  .stamp { transform: rotate(-4deg); padding: 10px 18px; border: 2.2px solid #C8202F; position: relative; font-family: var(--font-mono); font-weight: 700; font-size: 18px; letter-spacing: 0.32em; color: #C8202F; }
  .stamp::before { content:''; position: absolute; inset: 4px; border: 0.8px solid #C8202F; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; }
</style>
<div class="item"><div class="seal"><span>師</span></div><div class="label">Seal · indigo</div></div>
<div class="item"><div class="stamp">CLASSIFIED</div><div class="label">Stamp · &lt;2%</div></div>
