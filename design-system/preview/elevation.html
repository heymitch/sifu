<!doctype html><meta charset="utf-8">
<title>Elevation — hairlines, not shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; }
  .eb { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { padding: 18px; min-height: 90px; }
  .l1 { background: var(--bg); border: 1px solid var(--rule); }
  .l2 { background: var(--bg-deep); border: 1px solid var(--rule); }
  .l3 { background: #FFF; border: 1px solid var(--rule); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .t { font-family: var(--font-sans); font-weight: 500; font-size: 14px; color: var(--fg-1); }
  .d { font-family: var(--font-sans); font-weight: 300; font-size: 12px; color: var(--fg-2); margin-top: 4px; }
</style>
<div class="eb">Elevation · no drop shadows, ever</div>
<div class="grid">
  <div class="card l1"><div class="label">Level 0 · page</div><div class="t">Bone on bone</div><div class="d">Hairline only.</div></div>
  <div class="card l2"><div class="label">Level 1 · nested</div><div class="t">Bone deep</div><div class="d">Paper on paper.</div></div>
  <div class="card l3"><div class="label">Level 2 · reserved</div><div class="t">Pure white</div><div class="d">Used sparingly.</div></div>
</div>
