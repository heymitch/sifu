<!doctype html><meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; }
  .eb { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); width: 60px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 50px; }
  .bar { height: 10px; background: #1F1F1F; }
</style>
<div class="eb">Spacing · 4px base scale</div>
<div class="row"><span class="label">--sp-1</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
<div class="row"><span class="label">--sp-2</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
<div class="row"><span class="label">--sp-3</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
<div class="row"><span class="label">--sp-4</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
<div class="row"><span class="label">--sp-5</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
<div class="row"><span class="label">--sp-6</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
<div class="row"><span class="label">--sp-7</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
<div class="row"><span class="label">--sp-8</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
<div class="row"><span class="label">--sp-9</span><span class="px">96</span><span class="bar" style="width:96px"></span></div>
<div class="row"><span class="label">--sp-10</span><span class="px">128</span><span class="bar" style="width:128px"></span></div>
