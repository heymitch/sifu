<!doctype html><meta charset="utf-8">
<title>Brand · Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; display: flex; gap: 24px; align-items: center; }
  .panel { flex: 1; padding: 24px; border: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .panel.dark { background: #1F1F1F; }
  .eb { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; }
  .panel.dark .eb { color: #C9C7C2; }
  .wm { font-family: var(--font-sans); font-weight: 500; font-size: 44px; letter-spacing: -1.2px; color: #1F1F1F; position: relative; line-height: 1; }
  .wm.lt { color: #F2F0EB; }
  .wm .dot { position: absolute; right: -10px; bottom: 7px; width: 7px; height: 7px; border-radius: 50%; background: #2D4A87; }
</style>
<div class="panel"><span class="eb">Wordmark · light</span><div class="wm">Sifu<span class="dot"></span></div></div>
<div class="panel dark"><span class="eb">Wordmark · dark</span><div class="wm lt">Sifu<span class="dot"></span></div></div>
