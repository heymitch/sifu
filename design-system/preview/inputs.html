<!doctype html><meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .eb { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .field { display: flex; flex-direction: column; }
  input, textarea { font-family: var(--font-sans); font-weight: 300; font-size: 14px; padding: 10px 12px; background: transparent; border: 1px solid #C9C7C2; border-radius: 2px; color: #1F1F1F; outline: none; transition: border-color 120ms; }
  input:focus { border-color: #2D4A87; box-shadow: 0 0 0 1px #2D4A87; }
  .help { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; margin-top: 4px; }
  .filled { color: #1F1F1F; }
  .check { display: flex; align-items: center; gap: 10px; font-family: var(--font-sans); font-size: 14px; color: #1F1F1F; }
  .box { width: 16px; height: 16px; border: 1px solid #1F1F1F; border-radius: 2px; display: inline-flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size: 12px; color: #1F1F1F; }
</style>
<div class="field"><div class="eb">Workflow name</div><input value="Ticket triage" class="filled"><div class="help">Required</div></div>
<div class="field"><div class="eb">Tag</div><input placeholder="Add a tag…"><div class="help">Optional</div></div>
<div class="field"><div class="eb">Focus state</div><input value="hello@" style="border-color:#2D4A87; box-shadow: 0 0 0 1px #2D4A87"></div>
<div class="field"><div class="eb">Choices</div>
  <div style="display:flex; flex-direction:column; gap:8px; padding-top:4px">
    <label class="check"><span class="box">✓</span> Watch this workflow</label>
    <label class="check"><span class="box"></span> Send weekly digest</label>
  </div>
</div>
