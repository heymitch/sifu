<!doctype html><meta charset="utf-8">
<title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 64px; border: 1px solid var(--rule); }
  .name { font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--fg-1); letter-spacing: -0.005em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
  .eb { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
</style>
<div class="eb">Color · Primary palette</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F2F0EB"></div><div class="name">Bone white</div><div class="hex">#F2F0EB</div></div>
  <div class="sw"><div class="chip" style="background:#1F1F1F"></div><div class="name">Charcoal</div><div class="hex">#1F1F1F</div></div>
  <div class="sw"><div class="chip" style="background:#5A5752"></div><div class="name">Warm grey</div><div class="hex">#5A5752</div></div>
  <div class="sw"><div class="chip" style="background:#C9C7C2"></div><div class="name">Pale grey</div><div class="hex">#C9C7C2</div></div>
  <div class="sw"><div class="chip" style="background:#2D4A87"></div><div class="name">Indigo</div><div class="hex">#2D4A87</div></div>
</div>
